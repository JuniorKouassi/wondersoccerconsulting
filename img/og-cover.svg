<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">

  <!-- Background -->
  <rect width="1200" height="630" fill="#121214"/>

  <!-- Subtle radial glow behind mark -->
  <radialGradient id="glow" cx="50%" cy="50%" r="38%">
    <stop offset="0%"   stop-color="#D5AE65" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#D5AE65" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top gold line -->
  <rect x="0" y="0" width="1200" height="3" fill="#D5AE65" opacity="0.7"/>
  <!-- Bottom gold line -->
  <rect x="0" y="627" width="1200" height="3" fill="#D5AE65" opacity="0.4"/>

  <!-- ── HEXAGONAL MARK (6 concentric rings, flat-top, centre 440,315) ── -->
  <g transform="translate(440,315)">
    <!-- R=165 -->
    <polygon points="165,0 82.5,-143.1 -82.5,-143.1 -165,0 -82.5,143.1 82.5,143.1"
      stroke="#D5AE65" stroke-width="15" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <!-- R=142 -->
    <polygon points="142,0 71,-123 -71,-123 -142,0 -71,123 71,123"
      stroke="#D5AE65" stroke-width="15" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <!-- R=119 -->
    <polygon points="119,0 59.5,-103 -59.5,-103 -119,0 -59.5,103 59.5,103"
      stroke="#D5AE65" stroke-width="15" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <!-- R=96 -->
    <polygon points="96,0 48,-83.1 -48,-83.1 -96,0 -48,83.1 48,83.1"
      stroke="#D5AE65" stroke-width="15" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <!-- R=73 -->
    <polygon points="73,0 36.5,-63.2 -36.5,-63.2 -73,0 -36.5,63.2 36.5,63.2"
      stroke="#D5AE65" stroke-width="15" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <!-- R=50 -->
    <polygon points="50,0 25,-43.3 -25,-43.3 -50,0 -25,43.3 25,43.3"
      stroke="#D5AE65" stroke-width="15" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"/>
  </g>

  <!-- ── WORDMARK ── -->
  <!-- THE WONDER SOCCER -->
  <text x="620" y="268"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="64"
    letter-spacing="5"
    fill="#F5F2EC">THE WONDER SOCCER</text>

  <!-- Gold divider line -->
  <rect x="620" y="288" width="560" height="2" fill="#D5AE65" opacity="0.6"/>

  <!-- CONSULTING -->
  <text x="622" y="340"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="36"
    letter-spacing="20"
    fill="#D5AE65">CONSULTING</text>

  <!-- Tagline -->
  <text x="622" y="400"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="22"
    letter-spacing="2.5"
    fill="#8A8A8E">Licensed FIFA Agent · African Talents in Europe</text>

  <!-- Website URL -->
  <text x="622" y="488"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="18"
    letter-spacing="1.5"
    fill="#D5AE65" opacity="0.7">wondersoccerconsulting.com</text>

</svg>
