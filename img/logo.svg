<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- Hexagonal geometric mark — concentric rings, pointy-top, gold -->
  <g transform="translate(10, 5)">
    <!-- Ring 1 (outer) -->
    <polygon points="40,2 71,20 71,56 40,74 9,56 9,20"
             stroke="#D5AE65" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <!-- Ring 2 -->
    <polygon points="40,9 64,24 64,52 40,67 16,52 16,24"
             stroke="#D5AE65" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <!-- Ring 3 -->
    <polygon points="40,16 58,28 58,48 40,60 22,48 22,28"
             stroke="#D5AE65" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <!-- Ring 4 -->
    <polygon points="40,23 51,32 51,44 40,53 29,44 29,32"
             stroke="#D5AE65" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <!-- Ring 5 -->
    <polygon points="40,30 45,36 45,40 40,46 35,40 35,36"
             stroke="#D5AE65" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
    <!-- Ring 6 (inner) -->
    <polygon points="40,35 43,37 43,39 40,41 37,39 37,37"
             stroke="#D5AE65" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Text block -->
  <g transform="translate(100, 0)">
    <!-- THE WONDER SOCCER -->
    <text x="0" y="38"
          fill="#FFFFFF"
          font-family="'Archivo', Arial, sans-serif"
          font-weight="800"
          font-size="18"
          letter-spacing="2.5">THE WONDER SOCCER</text>
    <!-- CONSULTING -->
    <text x="2" y="58"
          fill="#D5AE65"
          font-family="'Archivo', Arial, sans-serif"
          font-weight="400"
          font-size="10.5"
          letter-spacing="5.5">CONSULTING</text>
    <!-- Thin gold line separator -->
    <line x1="0" y1="44" x2="210" y2="44" stroke="#D5AE65" stroke-width="0.6" opacity="0.5"/>
  </g>
</svg>
